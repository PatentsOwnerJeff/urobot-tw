name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 建立索引（僅公開示範語料）
        run: python ingest.py

      - name: 單元測試
        run: python -m pytest -q

      - name: 端到端冒煙測試（純檢索模式，不需任何 API key）
        run: |
          python retrieve.py 輸尿管結石多大需要手術
          python answer.py 血尿要做哪些檢查
          python eval.py
